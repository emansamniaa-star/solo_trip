services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    environment:
      PORT: 3001
      LOG_DIR: /app/logs
      CLIENT_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:3001
    volumes:
      - api_logs:/app/logs

volumes:
  api_logs:
